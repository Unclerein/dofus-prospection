[project]
name = "dofustool"
version = "0.1.0"
description = "Outil personnel d'analyse de marché Dofus 3 (capture passive)"
requires-python = ">=3.13"
dependencies = [
    "scapy>=2.6",
    "protobuf>=5",
    "bbpb>=1.4",
    "streamlit>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dofustool*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
